<!-- GroundLoop mark: the agent loop as four stage arcs (retrieve, generate,
     judge, recover) around a verified, grounded answer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GroundLoop">
  <rect width="32" height="32" rx="8" fill="#141417"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g fill="none" stroke-width="2.8" stroke-linecap="round">
    <path d="M17.6 7.75 A8.4 8.4 0 0 1 24.25 14.4" stroke="#2cc4d3"/>
    <path d="M24.25 17.6 A8.4 8.4 0 0 1 17.6 24.25" stroke="#a08bff"/>
    <path d="M14.4 24.25 A8.4 8.4 0 0 1 7.75 17.6" stroke="#f1c14e"/>
    <path d="M7.75 14.4 A8.4 8.4 0 0 1 14.4 7.75" stroke="#ff8a5b"/>
  </g>
  <circle cx="16" cy="16" r="3.1" fill="#3ccf8e"/>
</svg>
