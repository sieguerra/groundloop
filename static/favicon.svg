<!-- GroundLoop tab icon: the stage ring and verified dot with no tile, so it
     sits directly on the browser tab. Light colors, dark-scheme colors when
     the OS is dark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GroundLoop">
  <style>
    @media (prefers-color-scheme: dark) {
      .a1 { stroke: #2cc4d3; } .a2 { stroke: #a08bff; } .a3 { stroke: #f1c14e; } .a4 { stroke: #ff8a5b; } .dot { fill: #3ccf8e; }
    }
  </style>
  <g fill="none" stroke-width="3.8" stroke-linecap="round">
    <path class="a1" d="M18.21 4.61 A11.6 11.6 0 0 1 27.39 13.79" stroke="#0b9aa8"/>
    <path class="a2" d="M27.39 18.21 A11.6 11.6 0 0 1 18.21 27.39" stroke="#6d4fe0"/>
    <path class="a3" d="M13.79 27.39 A11.6 11.6 0 0 1 4.61 18.21" stroke="#e0a100"/>
    <path class="a4" d="M4.61 13.79 A11.6 11.6 0 0 1 13.79 4.61" stroke="#e2602f"/>
  </g>
  <circle class="dot" cx="16" cy="16" r="4.4" fill="#12a05f"/>
</svg>
